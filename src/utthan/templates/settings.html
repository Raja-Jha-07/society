{% extends 'base.html' %}{% block title %}Settings | Utthan{% endblock %}{% block content %}
<div class="page-heading"><div><h1>Settings</h1><p>Society identity and default monthly rules.</p></div></div>
<section class="panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label for="society_name">Society name</label><input id="society_name" name="society_name" value="{{ values.society_name }}" required></div><div class="field"><label for="group_name">Group name</label><input id="group_name" name="group_name" value="{{ values.group_name }}" required></div><div class="field"><label for="monthly_contribution">Default monthly contribution</label><input id="monthly_contribution" name="monthly_contribution" type="number" min="0" step="0.01" value="{{ values.monthly_contribution }}"></div><div class="field"><label for="default_emi">Default EMI</label><input id="default_emi" name="default_emi" type="number" min="0" step="0.01" value="{{ values.default_emi }}"></div><div class="field"><label for="monthly_interest_rate">Default monthly interest %</label><input id="monthly_interest_rate" name="monthly_interest_rate" type="number" min="0" step="0.01" value="{{ values.monthly_interest_rate }}"></div><div class="field full"><span class="note">Changes apply to future loans and periods only. Historical entries remain unchanged.</span></div><div><button class="button" type="submit">Save settings</button></div></form></section>{% endblock %}
