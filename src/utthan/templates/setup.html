{% extends 'base.html' %}{% block title %}First-time setup | Utthan{% endblock %}{% block content %}
<section class="auth-card"><div class="auth-logo">UTTHAN SOCIETY</div><h1>Secure first-time setup</h1><p class="subtitle">Create the first administrator. This page closes permanently after setup.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label for="username">Administrator username</label><input id="username" name="username" minlength="3" maxlength="50" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required></div><div class="field"><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" minlength="10" autocomplete="new-password" required></div><button class="button" type="submit">Create administrator</button></form><p class="note">Use at least 10 characters with uppercase, lowercase and a number.</p></section>{% endblock %}
